<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <link rel="stylesheet" href="https://unpkg.com/98.css" />
        <link rel="stylesheet" href="../assets/crt.css" />
        <style type="text/css">body { cursor: url('data:image/x-icon;base64,AAACAAEAICACAAcACQAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAgAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAYAAAAMAAAADAAAABgAAAEYAAABsAAAAfAAAAH+AAAB/AAAAfgAAAHwAAAB4AAAAcAAAAGAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////////////////////////////n////w////8P///+H///3h///8w////EP///wH///8AH///AD///wB///8A////Af///wP///8H////D////x////8/////f////////////////////////////////////////8='), auto; }</style>
        <style>
body {
    margin: 0;
    background-color: #008080;
    height: 90vh;
    width: 90vw;
}

.window {
    transform: scale(2.5);
}

.clock {
    width: 200px;
    margin: 0;
    position: absolute;
    top: calc(40% - 100px);
    left: calc(40% - 100px);
    text-align: center;
}

#time {
    font-size: 500%;
    margin: 0;
}

#date {
    /*font-size: 5vh;*/
    margin: 0;
}

.weather {
    width: 240px;
    position: absolute;
    right: 300px;
    bottom: 150px;
}

.weather #snowfall {
    font-size: 150%
}

.weather #temperature {
    font-size: 200%;
    font-weight: bold;
}

.title-bar-controls > button {
    margin-left: 2px;
    margin-right: 0;
    margin-top: 0;
    margin-bottom: 0;
    transform: scale(1.1);
}

#snow-container {  
    height: 100vh;
    overflow: hidden;
    position: absolute;
    top: 0;
    transition: opacity 500ms;
    width: 100%;
}

.snow {
    font-family: "Pixelated MS Sans Serif",Arial;
    animation: fall ease-in infinite, sway ease-in-out infinite;
    color: #eee;
    position: absolute;
}

@keyframes fall {
  0% {
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    top: 100vh;
    opacity: 1;
  }
}

@keyframes sway {
  0% {
    margin-left: 0;
  }
  25% {
    margin-left: 50px;
  }
  50% {
    margin-left: -50px;
  }
  75% {
    margin-left: 50px;
  }
  100% {
    margin-left: 0;
  }
}

        </style>
    </head>
    <body>
        <div class="crt">
            <div id="snow-container"></div>
            <div class="weather window">
                <div class="title-bar inactive">
                    <div class="title-bar-text">Weather</div>
                    <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize" disabled></button>
                    <button aria-label="Close"></button>
                    </div>
                </div>
                <div class="window-body">
                    <div id="snowfall"></div>
                    <div id="temperature"></div>
                </div>
                <div class="status-bar">
                    <p class="status-bar-field">Clouds: <span id="clouds">0</span>%</p>
                    <p class="status-bar-field">Rain: <span id="precipitation">0</span>mm</p>
                </div>
            </div>
            <div class="clock window">
                <div class="title-bar">
                    <div class="title-bar-text">Clock</div>
                    <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                    </div>
                </div>
                <div class="window-body">
                    <div id="time">12:00</div>
                    <div id="date">01-01-1970</div>
                </div>
            </div>
        </div>

        <div class="phosphorsWrapper">
            <div class="phosphorsContainer">
                <div class="red">
                    <div class="scanlines R "> </div>
                </div>

                <div class="green">
                    <div class="scanlines G "> </div>
                </div>

                <div class="blue">
                    <div class="scanlines B"> </div>
                </div>

                <div class="mask"></div>

            </div>
        </div>
        <script>
            const latitude = '0.0';
            const longitude = '0.0';

            const timeElement = document.getElementById('time');
            const dateElement = document.getElementById('date');
            const temperatureElement = document.getElementById('temperature');
            const clouds = document.getElementById('clouds');
            const precipitation = document.getElementById('precipitation');
            const snowfall = document.getElementById('snowfall');

            /** Snow utils **/
            let currentSnow = 0;
            const snowContainer = document.getElementById("snow-container");
            // const snowContent = ['&#10052', '&#10053', '&#10054']
            const snowContent = ['&#10052']


            const random = (num) => {
                return Math.floor(Math.random() * num);
            }

            const getRandomStyles = () => {
            const top = random(100);
            const left = random(100);
            const dur = random(10) + 10;
            const size = random(25) + 55;
            return `
                top: -${top}%;
                left: ${left}%;
                font-size: ${size}px;
                animation-duration: ${dur}s;
            `;
            }

            const createSnow = (num) => {
                currentSnow = num;
                for (var i = num; i > 0; i--) {
                    var snow = document.createElement("div");
                    snow.className = "snow";
                    snow.style.cssText = getRandomStyles();
                    snow.innerHTML = snowContent[random(snowContent.length)]
                    snowContainer.append(snow);
                }
            }

            const removeSnow = () => {
                currentSnow = 0;
                snowContainer.style.opacity = "0";
                return new Promise(resolve => {
                    setTimeout(() => {
                        snowContainer.innerHTML = '';
                        snowContainer.style.opacity = "1";
                        resolve();
                    }, 500)
                });
            }
            /** Snow utils end **/

            function pad00(arg) {
                return String(arg).padStart(2, '0');
            }

            function updateSnowfall(days) {
                let resolvedSnow = 1;
                if (days == 0) {
                    snowfall.innerText = '\u2744 Snow today! \u2744';
                    resolvedSnow = 30;
                } else if (days > 7) {
                    snowfall.innerText = 'No snow in the next 7 days :(';
                    resolvedSnow = 1;
                } else {
                    snowfall.innerText = 'Snow in ' + days + ' days! \u2744';
                    resolvedSnow = 10;
                }
                if (resolvedSnow !== currentSnow) {
                    removeSnow().then(() => createSnow(resolvedSnow));
                }
            }

            function updateTemperature(temp, units) {
                temperatureElement.innerText = 'Currently ' + temp + units;
            }

            window.setInterval(() => {
                const now = new Date();
                timeElement.innerText = pad00(now.getHours()) + ':' + pad00(now.getMinutes());
                dateElement.innerText = pad00(now.getDate()) + '-' + pad00(now.getMonth() + 1) + '-' + pad00(now.getFullYear());
            }, 300);

            function checkWeather() {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=snowfall_sum&current=temperature_2m,cloud_cover,rain,showers`;
                fetch(url)
                    .then(data => data.json())
                    .then(data => {
                        updateTemperature(data.current.temperature_2m, data.current_units.temperature_2m);
                        clouds.innerText = data.current.cloud_cover;
                        precipitation.innerText = Math.max(data.current.rain, data.current.showers);
                        const snowfall = data.daily.snowfall_sum;
                        let days = 8;
                        for (let i = 0; i < snowfall.length; i++) {
                            if (snowfall[i] > 0) {
                                days = i;
                                break;
                            }
                        }
                        updateSnowfall(days);
                    });
            }

            checkWeather();

            window.setInterval(checkWeather, 30 * 60_000);
        </script>
    </body>
</html>
